# 前置 L4 代理的最小配置：整份替换 nginx:1 镜像的主配置（stream 块必须写在 http 外面，
# 挂进 conf.d/ 是不生效的）。它只做一件事——把设备的真实来源地址写在连接最前面，
# 交给下面那个只认头部的 broker。
#
# nginx 的 `proxy_protocol on` 发的是 **v1 文本形式**：
#   PROXY TCP4 203.0.113.7 172.28.0.10 51432 1883\r\n
# broker 两种形式都解析，所以这里不需要改任何东西；要 v2 二进制形式的是 envoy/haproxy
# 那一类前置（v2 那条路径由 internal/proxyproto 的按字节单测和 test/proxy-check.mjs 钉住）。

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

stream {
    # 只搬字节，不解析 MQTT：后面是明文还是 TLS 它都不用知道。
    # 要让 mqtts 也过 LB，就再抄一个 server 块 listen 8883 → congmq:8883，同样带
    # proxy_protocol on；broker 侧 -tls-addr 在同一个网络里听着即可。
    upstream congmq_mqtt {
        # max_fails=0：连不上就当场拒掉，别让 nginx 把上游"拉黑"一小段时间——
        # 那会让已经恢复的 broker 继续收不到设备，而监控上只看得到 LB 的 5xx。
        server congmq:1883 max_fails=0;
    }

    server {
        listen 1883;

        # 这一行是本阶段存在的全部理由。方向要看清：它是**向后端发**头部。
        # `listen 1883 proxy_protocol` 是完全相反的意思（期望**前端**给它发头部），
        # 设备不会发那个，写在 listen 上等于把所有正常设备拒掉。
        proxy_protocol on;

        proxy_pass congmq_mqtt;
        proxy_connect_timeout 3s;

        # 空闲多久掐掉这条 TCP。MQTT 是长连接，这条必须明显大于设备 keepalive 的 1.5 倍，
        # 否则 broker 只看到"设备很有规律地掉线"，而日志里一句真话都没有。
        proxy_timeout 30m;
    }

    # $remote_addr 在这里就是设备的真实地址——nginx 是这条链上唯一知道它的进程，
    # 剩下的事全靠上面那个头部传下去。
    log_format mqtt '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/access.log mqtt;
}
