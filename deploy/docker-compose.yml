# 落地形态的最小样：设备 → nginx(L4, PROXY protocol) → congmq(私有网络, 只信这个头部)。
#
#   docker compose up -d --build          # broker + 负载均衡（设备口 127.0.0.1:1883）
#   curl -s localhost:8080/metrics | jq . # 指标只绑宿主机，不对外
#   docker compose down                   # 数据留在 named volume 里，下次 up 还在
#
# broker 用 `-proxy-protocol require`：1883 上不带合法头部的连接一律拒。这不是防御设备，
# 是防御"绕过负载均衡直连 broker 的人"——在那条路上真实来源地址根本不存在，
# 按来源地址做的限流、锁定、`ip` 规则全都只能判到 docker 网关。
# 如果确实要两种客户端并存（一部分设备直连、一部分经 LB），把 require 换成 trusted
# 并给出 `-trusted-proxy-cidr <nginx 所在网段>`，docker network inspect 能查到那个网段。
#
# 端口只绑 127.0.0.1 是刻意的：这台机器上通常已经有 nginx/traefik 在前面收公网，
# 需要直接暴露时改成 "1883:1883" 并把 TLS 交回 broker（-tls-addr）或前置层。

name: congmq

services:
  congmq:
    build:
      context: ..
      dockerfile: Dockerfile
    image: congmq:local
    command: >-
      -addr :1883
      -metrics :8080
      -store /var/lib/congmq
      -store-sync everysec
      -auth /etc/congmq/auth.jsonl
      -acl /etc/congmq/acl.jsonl
      -proxy-protocol require
      -proxy-header-timeout 3s
      -max-packet-size 1048576
    volumes:
      # -store 只写这一个目录；命名卷首次创建时继承镜像里的属主（uid 10001），
      # 所以以非 root 运行的进程才写得进去。
      - congmq-data:/var/lib/congmq
      # 仓库里那两个是示例规则（用户名/密码是公开写在文档里的），真机换成自己的。
      # 只读挂载不影响热加载：轮询器只 stat + 读。
      - ../rules:/etc/congmq:ro
    ports:
      # 只发布指标口。1883 故意不发布到宿主机：设备唯一的路是 lb → broker，
      # 而"每条连接都带合法头部"这件事只有在没有旁路才成立。
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # 镜像里已经是 uid 10001 + 静态二进制，这两条只是把"逃逸需要额外一个漏洞"写进配置。
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [mqtt]
    logging:
      options: {max-size: "10m", max-file: "3"}

  lb:
    image: nginx:1
    # nginx:1 启动命令默认就是 `-c /etc/nginx/nginx.conf`，而官方镜像那份把 stream 块
    # 写在 http 外面才能用，所以这里整体替换主配置，不动 entrypoint。
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped
    depends_on:
      # 上游名字是启动时解析的：broker 还没起来 nginx 会直接失败退出。
      # 有了健康条件，nginx 才等到 /readyz 返 200 才开始接设备。
      congmq:
        condition: service_healthy
    networks: [mqtt]

networks:
  # lb ↔ congmq 走这个网络；设备进不来，因为 broker 的 1883 没有发布到宿主机。
  mqtt:

volumes:
  congmq-data:
