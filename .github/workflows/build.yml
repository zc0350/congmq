name: build

# Three shapes on purpose:
#   push / pull_request -> prove the tree builds and that it speaks real MQTT
#   tag v*              -> the same proofs, then cross-compile and publish a Release
# `-race` is deliberately absent: it needs cgo, and this kernel is pure Go
# (CGO_ENABLED=0 in every build below), so CI must not start demanding a toolchain
# the released binaries never used. `cache: false` for the same reason — the module
# has no dependencies, so there is nothing worth caching.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "::error::gofmt wants these changed: $bad"; exit 1; fi

      # Windows runner 的默认 shell 是 PowerShell，`[ -z ... ]` 直接 ParserError。
      # 这一步是 bash 写的，就显式点名 bash；两个系统都要真的跑过它，
      # 否则等于只在 Linux 上验证过发布闸门。
      - name: the release check reads the version from this line
        shell: bash
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/congmq/main.go)
          if [ -z "$v" ]; then echo "::error::no const version found in cmd/congmq/main.go"; exit 1; fi
          echo "compiled-in version: $v"

      - run: go vet ./...
      - run: go test -count=1 ./...

  conformance:
    name: third-party client / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build the three binaries
        run: |
          go build -trimpath -o bin/congmq ./cmd/congmq
          go build -trimpath -o bin/congmq-cert ./cmd/congmq-cert
          go build -trimpath -o bin/congmq-load ./cmd/congmq-load

      - name: install the harness (mqtt.js only)
        working-directory: test
        run: npm ci --no-audit --no-fund

      # The first three scripts talk to a broker somebody else started, each with
      # different flags, so each gets its own broker and it dies with the step.
      - name: conformance.mjs (3.1.1, no rules)
        run: |
          ./bin/congmq -addr 127.0.0.1:1883 -log-level warn &
          broker=$!
          trap 'kill $broker 2>/dev/null' EXIT
          sleep 1
          (cd test && MQTT_URL=mqtt://127.0.0.1:1883 node conformance.mjs)

      - name: v5-check.mjs (5.0 capabilities)
        run: |
          ./bin/congmq -addr 127.0.0.1:1887 -topic-alias-max 4 -max-packet-size 512 \
            -receive-max 100 -metrics 127.0.0.1:1888 -log-level warn &
          broker=$!
          trap 'kill $broker 2>/dev/null' EXIT
          sleep 1
          (cd test && MQTT_URL=mqtt://127.0.0.1:1887 METRICS_URL=http://127.0.0.1:1888/metrics node v5-check.mjs)

      - name: rules-check.mjs (auth.jsonl / acl.jsonl)
        run: |
          ./bin/congmq -addr :1883 -auth rules/auth.jsonl -acl rules/acl.jsonl -log-level warn &
          broker=$!
          trap 'kill $broker 2>/dev/null' EXIT
          sleep 1
          (cd test && CONGMQ_PORT=1883 node rules-check.mjs)

      # These five start and kill their own brokers; they only need the binaries.
      - name: tls-check.mjs (TLS / mTLS)
        run: (cd test && node tls-check.mjs)

      - name: reload-check.mjs (no-downtime operations)
        run: (cd test && node reload-check.mjs)

      - name: crash-check.mjs (kill -9 and recover)
        run: (cd test && node crash-check.mjs)

      - name: abuse-check.mjs (per-address gate, lockout, subscription cap)
        run: (cd test && node abuse-check.mjs)

      # The balancer in this one is a mini proxy inside the harness process, so the
      # headers on the wire come from a second language's idea of the specification.
      # That is the point: the Go suite and the Go parser share a byte order, and only
      # an outside writer can show the bytes are the ones a real load balancer sends.
      - name: proxy-check.mjs (PROXY protocol v1/v2, trusted proxy list)
        run: (cd test && node proxy-check.mjs)

  # The deployment shape, run for real. Nothing above exercises Dockerfile,
  # deploy/docker-compose.yml or the nginx config — they are text until something
  # starts them, and a broken image is exactly the failure an operator meets first.
  # nginx here is not a stand-in: it is a third-party load balancer writing its own
  # PROXY header, which is the strongest available proof that the bytes we parse are
  # the bytes other people send.
  docker:
    name: container + load balancer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build the image the way an operator does
        run: docker build -t congmq:ci .

      - name: it is the binary this tree built, running as it claims
        run: |
          set -euo pipefail
          want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/congmq/main.go)
          # -version 打的是 "congmq 1.0.0"，取第二个字段再比。
          got=$(docker run --rm congmq:ci -version | awk '{print $2}')
          if [ "$want" != "$got" ]; then echo "::error::image reports '$got', source says '$want'"; exit 1; fi
          echo "image -version == $got"
          # 1883 > 1024，所以非 root 绑定不需要 CAP_NET_BIND_SERVICE；而 k8s 的
          # runAsNonRoot 只认这个 uid——这一行挂了说明镜像偷偷退回 root 了。
          who=$(docker run --rm --entrypoint id congmq:ci)
          echo "$who"
          echo "$who" | grep -q 'uid=10001'

      - name: bring up the shipped topology (nginx PROXY protocol -> congmq)
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose up -d --build
          # service_healthy 已经挡在 depends_on 里，60s 上限再兜一次：
          # 起不来要当场看见 compose ps 和两边的日志，而不是让 job 空转到 timeout-minutes。
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/readyz >/dev/null && break
            sleep 1
            if [ "$i" = 60 ]; then docker compose ps; docker compose logs --no-color; exit 1; fi
          done
          docker compose ps

      - name: a device talks to the broker through a real load balancer
        run: (cd test && npm ci --no-audit --no-fund && node lb-smoke.mjs)

      - name: and the counters say the header is what made the address real
        run: |
          curl -s http://127.0.0.1:8080/metrics | jq '{connections_over_proxy_header, refused_over_proxy_header, online, total_connections}'
          curl -s http://127.0.0.1:8080/metrics.txt | grep -E '^congmq_(connections|refused)_over_proxy_header'

      - name: an edit to the rules on the host reaches the running container
        working-directory: deploy
        run: |
          set -euo pipefail
          before=$(curl -s http://127.0.0.1:8080/metrics | jq -r .rules_generation)
          # 追加的是注释（装载器跳过 # 行，语义没变），但文件指纹变了——这正是不停机运维
          # 在容器里的那一半形状：宿主机上编辑 bind 进来的文件，容器里 :ro 照读，
          # 会话一条不掉。generation 不涨就等于挂载路径指错了，
          # operator 改完规则会以为生效了。语义本身（坏文件回滚、不踢已有会话）
          # 由 test/reload-check.mjs 钉，这里只证明"改得动"。
          printf '# appended by CI at %s\n' "$(date -u +%FT%TZ)" >> ../rules/auth.jsonl
          after=$before
          for i in $(seq 1 20); do
            after=$(curl -s http://127.0.0.1:8080/metrics | jq -r .rules_generation)
            [ "$after" != "$before" ] && break
            sleep 1
          done
          echo "rules_generation $before -> $after"
          [ "$after" != "$before" ] || { echo "::error::the edited rules never reached the container"; exit 1; }
          curl -s http://127.0.0.1:8080/metrics | jq -e '.rules_reload_failures == 0' >/dev/null

      - name: a container restart keeps the durable state
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose restart congmq
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/readyz >/dev/null
          # -store 落在 named volume 上；"换容器不丢状态"这句话只有真换过一次容器才算证明。
          docker compose exec -T congmq sh -c 'ls -l /var/lib/congmq/state.log'
          docker compose logs congmq | grep -E 'msg="store open"' | tail -1

      - if: always()
        name: container logs
        working-directory: deploy
        run: docker compose logs --no-color | tail -120

      - if: always()
        name: tear down
        working-directory: deploy
        run: docker compose down -v

  cross-compile:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    needs: [go, conformance, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: "7"}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: the tag must equal the compiled-in version
        run: |
          want=${GITHUB_REF_NAME#v}
          got=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/congmq/main.go)
          if [ "$want" != "$got" ]; then
            echo "::error::tag is v$want but cmd/congmq/main.go says $got — bump the constant or retag"
            exit 1
          fi
          echo "v$want == const version $got"

      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          arch="$GOARCH"
          [ -n "${GOARM:-}" ] && arch="armv$GOARM"
          name="congmq-${GITHUB_REF_NAME}-${GOOS}-${arch}"
          mkdir -p "$name" dist
          for cmd in congmq congmq-load congmq-cert; do
            # No -s -w: a broker's panic trace and goroutine dump are the operator's
            # only forensics, and a few MB is not worth losing them.
            go build -trimpath -o "$name/$cmd$ext" "./cmd/$cmd"
          done
          # 归档里保持和仓库一样的目录：README 的开发示例写的是
          # `rules/auth.jsonl`，拍平了拷到二进制旁边，照着 README 敲的人会找不到文件。
          mkdir -p "$name/rules"
          # MIT 唯一的条件是"分发时必须带上许可声明"。拿走 tar.gz 的人是直接跑起来的，
          # 不会回来看 git，所以声明跟着二进制走，而不只是躺在源码仓库里。
          cp LICENSE README.md Dockerfile .dockerignore "$name/"
          cp rules/auth.jsonl rules/acl.jsonl "$name/rules/"
          # 部署形态跟着二进制走：systemd 那两个文件在归档里就能直接用（StateDirectory
          # 由 systemd 建，ExecStart 指的就是同目录那个 congmq），Dockerfile 与 compose
          # 是"官方镜像长什么样"的参照，从 git checkout 里 build 才完整。
          mkdir -p "$name/deploy/nginx" "$name/deploy/systemd"
          cp deploy/docker-compose.yml "$name/deploy/"
          cp deploy/nginx/nginx.conf "$name/deploy/nginx/"
          cp deploy/systemd/congmq.service deploy/systemd/congmq.default "$name/deploy/systemd/"
          (cd "$name" && sha256sum congmq* > SHA256SUMS.txt)
          if [ "$GOOS" = "windows" ]; then
            zip -qr "dist/${name}.zip" "$name"
          else
            tar czf "dist/${name}.tar.gz" "$name"
          fi
          rm -rf "$name"
          (cd dist && sha256sum congmq-* > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist
          if-no-files-found: error

  release:
    name: publish release
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: one checksum file for the whole release
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum congmq-* > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 故意不 checkout 源码：它发布的是 cross-compile 的产物，不是工作树。
          # gh 在没有 .git 的地方要靠 GH_REPO 才知道往哪个仓库发；少了它，
          # 前面每一步都绿，最后一步只留一句 "failed to run git: not a git repository"。
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "congmq $tag" \
              --latest \
              --notes "手写内核的 MQTT 3.1.1 + 5.0 broker，零第三方运行时依赖，MIT 许可。每个归档含 congmq / congmq-load / congmq-cert、示例规则文件、Dockerfile 与 deploy/（compose + nginx PROXY protocol 配置 + systemd unit）、LICENSE 与 SHA256SUMS.txt；能力、边界、部署形态与实测容量基线见 README。"
          fi
          gh release view "$tag" --json tagName,assets --jq '.tagName + " -> " + ([.assets[].name] | join(", "))'
